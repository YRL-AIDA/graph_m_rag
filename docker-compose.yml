services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - rag-network

  mineru:
    build:
      context: ./mineru
      dockerfile: Dockerfile
    container_name: rag-mineru
    ports:
      - "8001:8000"
    environment:
      - MODELSCOPE_CACHE=/app/models
      - PYTHONUNBUFFERED=1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
    volumes:
      - mineru_models:/app/models
      - ./data:/app/data
    networks:
      - rag-network
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all # Request all available GPUs
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "16333:6333"
      - "16334:6334"
    networks:
      - rag-network
    environment:
      - API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s

  neo4j:
    image: neo4j:5.26.24-ubi9
    container_name: rag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    volumes:
      - neo4j_data:/neo4j_data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "echo > /dev/tcp/localhost/7687"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s

  semantic_index:
    build:
      context: .
      dockerfile: semantic_graph/Dockerfile
    container_name: rag-semantic-index
    ports:
      - "9595:9595"
    environment:
      - URL=${NEO4J_URL:-neo4j}
      - USER_NEO4J=${NEO4J_USER:-neo4j}
      - PASSWORD=${NEO4J_PASSWORD:-password}
      - NAME_DB=${NEO4J_DB:-neo4j}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333/}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - LLM_URL=${LLM_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen3-VL-32B-Thinking}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://192.168.19.127:10115/embedding}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2048}
      - N4G_URL=${N4G_URL:-http://neo4j:7474}
    networks:
      - rag-network
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9595/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  rag-network:
    driver: bridge

volumes:
  minio_data:
  mineru_models:
  qdrant_data:
  neo4j_data: